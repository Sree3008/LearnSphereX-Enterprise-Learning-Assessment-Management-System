<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mark Attendance</title>

    <link rel="stylesheet"
          th:href="@{/css/attendance.css}">

</head>


<body>

<div class="app-shell">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-mark">
                L
            </div>

            <div>

                <strong>LearnSphereX</strong>

                <span>
                    TRAINING MANAGEMENT
                </span>

            </div>

        </div>


        <nav class="nav">

            <div class="nav-label">
                MAIN MENU
            </div>

            <a href="/batches"
               class="nav-item">

                📚 Batch

            </a>

            <a href="/attendance"
               class="nav-item">

                📋 Attendance

            </a>

            <a href="#"
               class="nav-item">

                🎓 Courses

            </a>

            <a href="#"
               class="nav-item">

                👨‍🎓 Students

            </a>

            <a href="#"
               class="nav-item">

                🔔 Notifications

            </a>

        </nav>


        <div class="sidebar-footer">

            <div class="mini-avatar">
                A
            </div>

            <div>

                <strong>Admin</strong>

                <span>
                    Administrator
                </span>

            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main-area">


        <!-- TOP BAR -->

        <header class="topbar">

            <div>

                <span class="eyebrow">
                    ATTENDANCE
                </span>

                <h1>
                    Mark Attendance
                </h1>

            </div>


            <div class="topbar-right">

                <span class="status-dot"></span>

                System Online

                <div class="top-avatar">
                    A
                </div>

            </div>

        </header>


        <!-- CONTENT -->

        <section class="page-content">


            <div class="page-title">

                <div>

                    <h2>
                        Attendance Entry
                    </h2>

                    <p>
                        Record attendance for a student.
                    </p>

                </div>

            </div>


            <!-- FORM -->

            <div class="form-panel">


                <form th:action="${attendance.id == null}
                        ? @{/attendance}
                        : @{/attendance/{id}(id=${attendance.id})}"
                      th:object="${attendance}"
                      method="post">


                    <div class="form-grid">


                        <!-- BATCH ID -->

                        <div class="field">

                            <label>
                                Batch ID
                                <span class="required">*</span>
                            </label>

                            <input type="number"
                                   class="input"
                                   th:field="*{batchId}"
                                   placeholder="Enter batch ID"
                                   required>

                        </div>


                        <!-- STUDENT ID -->

                        <div class="field">

                            <label>
                                Student ID
                                <span class="required">*</span>
                            </label>

                            <input type="number"
                                   class="input"
                                   th:field="*{studentId}"
                                   placeholder="Enter student ID"
                                   required>

                        </div>


                        <!-- DATE -->

                        <div class="field">

                            <label>
                                Attendance Date
                                <span class="required">*</span>
                            </label>

                            <input type="date"
                                   class="input"
                                   th:field="*{attendanceDate}"
                                   required>

                        </div>


                        <!-- STATUS -->

                        <div class="field">

                            <label>
                                Status
                                <span class="required">*</span>
                            </label>

                            <select class="select"
                                    th:field="*{status}"
                                    required>

                                <option value="">
                                    Select Status
                                </option>

                                <option value="PRESENT">
                                    PRESENT
                                </option>

                                <option value="ABSENT">
                                    ABSENT
                                </option>

                                <option value="LATE">
                                    LATE
                                </option>

                            </select>

                        </div>


                    </div>


                    <!-- BUTTONS -->

                    <div class="form-actions">

                        <a href="/attendance"
                           class="btn secondary">

                            Cancel

                        </a>


                        <button type="submit"
                                class="btn primary">

                            Save Attendance

                        </button>

                    </div>


                </form>


            </div>


        </section>


        <footer class="footer">

            <span>
                LearnSphereX
            </span>

            <span>
                Attendance Management
            </span>

        </footer>


    </main>

</div>

</body>

</html>
