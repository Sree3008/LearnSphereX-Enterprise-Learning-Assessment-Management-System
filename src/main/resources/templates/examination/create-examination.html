<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Create Examination</title>

    <link rel="stylesheet" th:href="@{/css/examination.css}">
</head>

<body>

<div class="container">

    <h1>Create Examination</h1>

    <form th:action="@{/examination-page/create}"
          method="post">

        <label>Title</label>
        <input type="text"
               name="title"
               required>

        <br><br>

        <label>Description</label>
        <textarea name="description"
                  required></textarea>

        <br><br>

        <label>Duration (minutes)</label>
        <input type="number"
               name="durationMinutes"
               required>

        <br><br>

        <button type="submit" class="btn">
            Create Examination
        </button>

        <a th:href="@{/examination-page}"
           class="view-btn">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
